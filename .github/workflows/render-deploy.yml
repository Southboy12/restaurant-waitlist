# Render CI/CD for restaurant-waitlist (free tier).
#
# The repo's root Dockerfile is a complete, self-contained service: it builds the
# React frontend and the FastAPI backend serves it from the same origin (no CORS
# or frontend/backend split). Render runs that single image as a free web
# service on the injected $PORT, health-checked on /api/health.
#
# Pipeline: unit tests -> compose integration + e2e -> (push to main/master)
# trigger a Render deploy via deploy hook -> verify the live app. Deploys are
# gated on all tests passing, so a broken build never ships.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   - RENDER_DEPLOY_HOOK_URL: the Render service's Deploy Hook URL
#         (Render Dashboard -> service -> Settings -> Deploy Hook). Secret.
#   - RENDER_APP_URL: the service's public URL, no trailing slash,
#         e.g. https://restaurant-waitlist.onrender.com
#
# The Render service itself is provisioned by render.yaml (Render Blueprint):
# create it once via Dashboard -> New -> Blueprint -> this repo. JWT_SECRET is
# auto-generated by Render; DATABASE_URL defaults to an in-container SQLite file.

name: Render CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  API_BASE_URL: http://localhost:8000

jobs:
  # ---------------------------------------------------------------------------
  # 1. Unit tests — run in parallel (backend + frontend independent)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run backend unit tests
        run: uv run pytest tests/ -q --ignore=tests/test_integration.py --ignore=tests/test_e2e.py

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Run frontend tests
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. Compose stack: build + integration + end-to-end tests
  # ---------------------------------------------------------------------------
  compose-tests:
    name: Compose integration + e2e tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner deps
        run: |
          pip install pytest requests
          pip install ./backend

      - name: Verify docker compose is available
        run: docker compose version

      - name: Build and start the compose stack
        run: docker compose up -d --build

      - name: Wait for the stack to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "Stack is healthy"
              exit 0
            fi
            echo "Waiting for stack... ($i/60)"
            sleep 5
          done
          echo "Stack never became healthy"
          docker compose logs --tail=100
          exit 1

      - name: Run integration tests against compose
        run: python -m pytest backend/tests/test_integration.py -v
        env:
          API_BASE_URL: http://localhost:8000

      - name: Run end-to-end tests against compose
        run: python -m pytest backend/tests/test_e2e.py -v
        env:
          API_BASE_URL: http://localhost:8000

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down the compose stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 3. Deploy to Render (only on pushes to main/master, after tests pass)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [compose-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    concurrency: deploy-group
    steps:
      - name: Validate deploy secrets are configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set. In Render: service -> Settings -> Deploy Hook -> copy the URL, then add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "${RENDER_APP_URL:-}" ]; then
            echo "::error::RENDER_APP_URL secret is not set. Add the service's public URL (e.g. https://restaurant-waitlist.onrender.com) under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Deploy hook: a single POST starts a new deploy of the service.
          # We pin ref=<sha> to the exact commit that just passed tests so a
          # racing push can't cause Render to deploy an untested commit. Render
          # builds the root Dockerfile and rolls it out; no Docker build happens
          # here, so a failure is almost always a missing/wrong hook URL.
          #
          # Render hook URLs already contain a query string (?key=...), so we
          # must append ref= with the correct separator (&, not ?). Using a
          # second ? yields "...?key=...?ref=..." which Render rejects with 404.
          echo "Triggering Render deploy for commit $COMMIT_SHA..."
          sep='?'
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) sep='&' ;;
          esac
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${COMMIT_SHA}"
          echo "Deploy triggered. Render will build and roll out the service."

  # ---------------------------------------------------------------------------
  # 4. Post-deploy validation: poll the live health endpoint + frontend
  # ---------------------------------------------------------------------------
  verify-deploy:
    name: Verify Render deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for the new deploy to go live
        # Render free instances cold-start on first request after a deploy.
        run: sleep 45

      - name: Check live health endpoint
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL%/}"
          echo "Checking $APP_URL/api/health"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$APP_URL/api/health" || echo "000")
            echo "Attempt $i/30: HTTP $CODE"
            if [ "$CODE" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json; then
              echo "Deploy verified: $APP_URL is healthy"
              cat /tmp/health.json
              exit 0
            fi
            sleep 15
          done
          echo "Live health check failed after 30 attempts"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Check frontend is served
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL%/}"
          CODE=$(curl -s -o /tmp/index.html -w "%{http_code}" "$APP_URL/" || echo "000")
          echo "Frontend HTTP $CODE"
          grep -q '<div id="root">' /tmp/index.html && echo "Frontend OK" || (echo "Frontend check failed"; exit 1)
