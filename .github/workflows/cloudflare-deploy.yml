# Cloudflare CI/CD for restaurant-waitlist
# Deploys the backend to Cloudflare Containers and the frontend to Cloudflare Pages,
# with a D1 database for production data.
#
# Required GitHub repository secrets:
#   - CLOUDFLARE_ACCOUNT_ID:   Cloudflare account ID
#   - CLOUDFLARE_API_TOKEN:    Cloudflare API token with Containers, D1, Pages permissions
#   - JWT_SECRET:              Production JWT signing secret

name: Cloudflare CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  API_BASE_URL: http://localhost:8000
  FLY_APP_NAME: restaurant-waitlist
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_PROJECT_NAME: restaurant-waitlist
  D1_DATABASE_NAME: waitlist-db

jobs:
  # ---------------------------------------------------------------------------
  # 1. Unit tests — run in parallel (backend + frontend independent)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run backend unit tests
        run: uv run pytest tests/ -q --ignore=tests/test_integration.py --ignore=tests/test_e2e.py

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Run frontend tests
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. Compose stack: build + integration + end-to-end tests
  # ---------------------------------------------------------------------------
  compose-tests:
    name: Compose integration + e2e tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner deps
        run: |
          pip install pytest requests
          pip install ./backend

      - name: Verify docker compose is available
        run: docker compose version

      - name: Build and start the compose stack
        run: docker compose up -d --build

      - name: Wait for the stack to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "Stack is healthy"
              exit 0
            fi
            echo "Waiting for stack... ($i/60)"
            sleep 5
          done
          echo "Stack never became healthy"
          docker compose logs --tail=100
          exit 1

      - name: Run integration tests against compose
        run: python -m pytest backend/tests/test_integration.py -v
        env:
          API_BASE_URL: http://localhost:8000

      - name: Run end-to-end tests against compose
        run: python -m pytest backend/tests/test_e2e.py -v
        env:
          API_BASE_URL: http://localhost:8000

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down the compose stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 3. Deploy to Cloudflare (only on pushes to main/master, after tests pass)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [compose-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    concurrency: deploy-group
    outputs:
      app-url: ${{ steps.worker-url.outputs.app-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # wrangler >= 4.148 requires Node.js >= 22.
          node-version: "22"

      - name: Install Cloudflare wrangler
        # Pin to the version validated locally: >=4.136 for durable_object
        # scheduling + images.base.dockerfile config shape.
        run: npm install -g wrangler@4.148.0

      - name: Verify wrangler authentication
        run: npx wrangler whoami

      - name: Ensure D1 database exists
        env:
          D1_DATABASE_NAME: ${{ env.D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          DB_JSON=$(npx wrangler d1 list --json | jq --arg name "$D1_DATABASE_NAME" '[.[] | select(.name == $name)]')
          if [ "$(echo "$DB_JSON" | jq 'length')" -eq 0 ]; then
            echo "Creating D1 database '$D1_DATABASE_NAME'..."
            npx wrangler d1 create "$D1_DATABASE_NAME"
          else
            echo "D1 database '$D1_DATABASE_NAME' already exists."
          fi
          # Authoritative record: d1 info returns uuid/name for the named DB.
          INFO=$(npx wrangler d1 info "$D1_DATABASE_NAME" --json)
          echo "$INFO" | jq .
          D1_ID=$(echo "$INFO" | jq -r '.uuid // empty')
          if [ -z "$D1_ID" ]; then
            echo "::error::Could not determine uuid for D1 database '$D1_DATABASE_NAME'"
            exit 1
          fi
          echo "D1_DATABASE_ID=$D1_ID" >> "$GITHUB_ENV"

      - name: Sync D1 database_id into wrangler.toml
        run: |
          set -euo pipefail
          echo "Binding wrangler.toml to D1 id: ${{ env.D1_DATABASE_ID }}"
          python3 - "$D1_DATABASE_ID" <<'PY'
          import re, sys
          new_id = sys.argv[1]
          path = "wrangler.toml"
          text = open(path).read()
          text, n = re.subn(r'(?m)^database_id\s*=.*$', f'database_id = "{new_id}"', text, count=1)
          assert n == 1, "expected exactly one database_id line in wrangler.toml"
          open(path, "w").write(text)
          print(f"Updated database_id (1 line)")
          PY
          grep -n '^database_id' wrangler.toml

      - name: Build frontend for Worker assets
        run: |
          set -euo pipefail
          cd frontend && npm ci && npm run build
          test -f dist/index.html || (echo "::error::frontend/dist/index.html missing after build"; exit 1)

      - name: Set production secrets on the Worker
        env:
          JWT_SECRET_VALUE: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${JWT_SECRET_VALUE:-}" ]; then
            echo "::error::JWT_SECRET repo secret is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          printf '%s' "$JWT_SECRET_VALUE" | npx wrangler secret put JWT_SECRET

      - name: Build and push container image
        run: |
          set -euo pipefail
          npx wrangler containers build . -t "${{ env.CLOUDFLARE_PROJECT_NAME }}:latest" --push

      - name: Deploy Worker + container to Cloudflare
        run: |
          set -euo pipefail
          # wrangler.toml selects the image via [containers.images.base]; the
          # explicit build step above keeps failures legible, deploy reuses it.
          npx wrangler deploy

      - name: Record the public Worker URL
        id: worker-url
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SUBDOMAIN=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result.subdomain // empty')
          if [ -z "$SUBDOMAIN" ]; then
            echo "::error::Could not resolve the account's workers.dev subdomain."
            exit 1
          fi
          APP_URL="https://${{ env.CLOUDFLARE_PROJECT_NAME }}.${SUBDOMAIN}.workers.dev"
          echo "APP_URL=$APP_URL"
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "app-url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Cloudflare Pages
        run: |
          set -euo pipefail
          # Idempotent: the project may already exist from a previous run.
          npx wrangler pages project create "${{ env.CLOUDFLARE_PROJECT_NAME }}" \
            --production-branch "${GITHUB_REF_NAME:-master}" || true
          npx wrangler pages deploy frontend/dist --project-name="${{ env.CLOUDFLARE_PROJECT_NAME }}"

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "Build/push/deploy failed. Check logs above."

  # ---------------------------------------------------------------------------
  # 4. Post-deploy validation: poll the live health endpoint
  # ---------------------------------------------------------------------------
  verify-deploy:
    name: Verify Cloudflare deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for release to go live
        run: sleep 45

      - name: Check live health endpoint
        run: |
          set -euo pipefail
          APP_URL="${{ needs.deploy.outputs.app-url }}"
          echo "Checking $APP_URL/api/health"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$APP_URL/api/health" || echo "000")
            echo "Attempt $i/20: HTTP $CODE"
            if [ "$CODE" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json; then
              echo "Deploy verified: $APP_URL is healthy"
              cat /tmp/health.json
              exit 0
            fi
            sleep 15
          done
          echo "Live health check failed after 20 attempts"
          exit 1

      - name: Check frontend is served
        run: |
          set -euo pipefail
          APP_URL="${{ needs.deploy.outputs.app-url }}"
          CODE=$(curl -s -o /tmp/index.html -w "%{http_code}" "$APP_URL/" || echo "000")
          echo "Frontend HTTP $CODE"
          grep -q '<div id="root">' /tmp/index.html && echo "Frontend OK" || (echo "Frontend check failed"; exit 1)
