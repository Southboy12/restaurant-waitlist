# Render Blueprint — restaurant-waitlist (free tier).
#
# The root Dockerfile is a complete, self-contained service: it builds the React
# frontend and the FastAPI backend serves it from the same origin (no CORS or
# frontend/backend split). Render runs that single image as a free web service,
# bound to the injected $PORT (Render default 10000), health-checked on
# /api/health.
#
# One-time setup:
#   1. Render Dashboard -> New -> Blueprint -> select this repo -> Apply.
#      Render reads this file, creates the free web service, and auto-generates
#      JWT_SECRET.
#   2. Copy the service's Deploy Hook URL (Settings -> Deploy Hook) into the
#      GitHub secret  RENDER_DEPLOY_HOOK_URL .
#   3. Copy the service's public URL (no trailing slash), e.g.
#      https://restaurant-waitlist.onrender.com , into the GitHub secret
#      RENDER_APP_URL .
#
# Deploys are gated by CI: autoDeploy is false, so pushes never bypass tests.
# The GitHub Actions workflow triggers a deploy only after all tests pass.

services:
  - type: web
    runtime: docker
    name: restaurant-waitlist
    plan: free
    region: oregon
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      # Auto-generated by Render on blueprint sync; persists across deploys so
      # issued JWTs stay valid.
      - key: JWT_SECRET
        generateValue: true
      # DATABASE_URL is intentionally left unset: the app falls back to an
      # in-container SQLite file. Render's free filesystem is ephemeral, so data
      # resets on each deploy/restart. For persistence, add a Render Postgres
      # (or any external DB) and set DATABASE_URL to its connection string here.
